<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vector Simulator</title>
    <!-- Use absolute path so the static server always finds it -->
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <div class="container">
      <header class="topbar">
        <div>
          <h1>Vector Simulator</h1>
          <div id="status" class="status">Ready.</div>
        </div>
        <div class="row">
          <button id="refresh">Refresh</button>
          <button id="reset" class="danger">Reset</button>
        </div>
      </header>

      <section class="panel">
        <h2>Visualization</h2>
        <!-- Canvas size is the drawing resolution; CSS controls display size -->
        <canvas id="viz" width="800" height="500"></canvas>
        <div class="hint">
          Tip: try field <code>x = y</code>, <code>y = -x</code> for a swirl.
        </div>
      </section>

      <section class="panel">
        <h2>Field</h2>
        <div class="row">
          <label>
            X:
            <input id="fieldX" value="y" />
          </label>
          <label>
            Y:
            <input id="fieldY" value="-x" />
          </label>
          <button id="setField">Set Field</button>
        </div>
      </section>

      <section class="panel">
        <h2>Add Particle</h2>
        <div class="row">
          <label>
            x:
            <input id="px" type="number" step="0.1" value="0" />
          </label>
          <label>
            y:
            <input id="py" type="number" step="0.1" value="0" />
          </label>
          <label>
            charge:
            <select id="charge">
              <option value="1">+1</option>
              <option value="-1">-1</option>
            </select>
          </label>
          <button id="addParticle">Add</button>
        </div>
      </section>

      <section class="panel">
        <h2>Controls</h2>
        <div class="row">
          <label>
            n:
            <input id="n" type="number" min="1" value="1" />
          </label>
          <button id="step">Step</button>
          <button id="play">Play</button>
          <button id="pause">Pause</button>
        </div>
      </section>

      <section class="panel">
        <h2>State (raw JSON)</h2>
        <pre id="state"></pre>
      </section>
    </div>

    <!-- Use absolute path so the static server always finds it -->
    <script src="/app.js"></script>
  </body>
</html>
